<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پروژه‌ی مسکونی | تعاونی مسکن پالایشگاه گاز ولیعصر (عج)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body {
    font-family: Tahoma, sans-serif;
    background: #f9f9f9;
    margin: 0;
    padding: 24px;
    direction: rtl;
  }
  h1 {
    text-align: center;
    color: #2e7d32;
  }
  .grid {
    max-width: 1100px;
    margin: 24px auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  .grid img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-radius: 10px;
    box-shadow: 0 1px 5px rgba(0,0,0,0.15);
    cursor: pointer;
    transition: transform 0.2s;
  }
  .grid img:hover { transform: scale(1.03); }
  #empty-msg { text-align: center; color: #888; margin-top: 40px; }

  /* نمایش بزرگ عکس با کلیک */
  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  #lightbox img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 8px;
  }
</style>
</head>
<body>

<h1>تصاویر پروژه‌ی مسکونی</h1>
<div class="grid" id="gallery"></div>
<div id="empty-msg" style="display:none;">هنوز عکسی اضافه نشده است.</div>

<div id="lightbox" onclick="this.style.display='none'">
  <img id="lightbox-img" src="">
</div>

<script>
const SUPABASE_URL = 'https://gsqwuibzplwalrahevdc.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_8duEw2Pj-B8fEupNzDzHag_CHN0riMC';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function loadGallery() {
  const grid = document.getElementById('gallery');
  const { data: files, error } = await sb.storage.from('gallery').list('', {
    sortBy: { column: 'created_at', order: 'desc' }
  });

  if (error || !files || files.length === 0) {
    document.getElementById('empty-msg').style.display = 'block';
    return;
  }

  for (const file of files) {
    const { data: urlData } = sb.storage.from('gallery').getPublicUrl(file.name);
    const img = document.createElement('img');
    img.src = urlData.publicUrl;
    img.onclick = () => {
      document.getElementById('lightbox-img').src = urlData.publicUrl;
      document.getElementById('lightbox').style.display = 'flex';
    };
    grid.appendChild(img);
  }
}

loadGallery();
</script>
</body>
</html>
