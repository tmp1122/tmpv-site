<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جزئیات پروژه | تعاونی مسکن پالایشگاه گاز ولیعصر (عج)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap">
<style>
:root{
  --font-family:'Vazirmatn','Tahoma',sans-serif;
  --primary:#2d7a3a; --primary-dark:#1a5c26; --primary-light:#4caf64;
  --page-bg:#f0f7f1; --alt-bg:#e8f4ea; --text-color:#0d2010;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-family);direction:rtl;background:var(--page-bg);color:var(--text-color);min-height:100vh;line-height:1.9;font-size:14px}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
nav{position:sticky;top:0;z-index:100;background:rgba(232,244,234,.97);backdrop-filter:blur(14px);border-bottom:1px solid #c8e0cb;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:14px;flex-shrink:0}
.logo-text{font-size:13px;font-weight:800;color:var(--text-color);line-height:1.3}
.back{color:var(--primary);font-size:13px;font-weight:700;padding:8px 14px;border:1.5px solid var(--primary);border-radius:8px}
.back:hover{background:var(--primary);color:#fff}
.cover{position:relative;min-height:56vh;display:flex;align-items:flex-end;background:#173a1e no-repeat center/cover;padding:60px 40px 40px}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(6,20,9,.88),rgba(6,20,9,.25) 55%,rgba(6,20,9,.1))}
.cover-in{position:relative;z-index:1;max-width:1000px;margin:0 auto;width:100%}
.tag{font-size:11px;letter-spacing:4px;color:#a0d4a8;font-weight:700;margin-bottom:10px;display:block}
.cover h1{font-size:clamp(26px,4.4vw,44px);font-weight:900;color:#fff;line-height:1.3;margin-bottom:10px}
.cover p{color:#e3f3e6;font-size:14.5px;max-width:640px}
.badge{display:inline-block;padding:3px 12px;border-radius:20px;font-size:11px;font-weight:700;margin-top:12px}
.badge-g{background:#d4f0da;color:#0d3b18;border:1px solid var(--primary-dark)}
.badge-y{background:#fff3cd;color:#7a4f00;border:1px solid #d4a017}
section.sec{padding:56px 40px}
section.sec.alt{background:var(--alt-bg)}
.sec-inner{max-width:1000px;margin:0 auto}
.sec h2{font-size:24px;font-weight:900;margin-bottom:22px;color:var(--text-color)}
.section-tag{font-size:11px;letter-spacing:4px;color:var(--primary);font-weight:700;margin-bottom:8px;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:#fff;border:1px solid #c8e0cb;border-radius:14px;padding:22px}
.card h3{font-size:15.5px;font-weight:700;margin-bottom:12px;color:var(--primary)}
dl{display:grid;grid-template-columns:max-content 1fr;gap:0 16px}
dt,dd{padding:8px 0;border-bottom:1px dashed #c8e0cb;font-size:13.5px}
dt{color:#5a7a5e}
dd{font-weight:700}
dl>:nth-last-child(-n+2){border-bottom:0}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.tabs button{background:#fff;border:1.5px solid #c8e0cb;border-radius:999px;padding:8px 18px;font-size:13px;font-weight:700;color:var(--text-color)}
.tabs button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.thumb{position:relative;border:0;padding:0;border-radius:12px;overflow:hidden;background:#ddd;aspect-ratio:4/3}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
.thumb:hover img{transform:scale(1.05)}
.empty{color:#6a8a6e;font-size:13.5px;padding:10px 2px}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.vid{background:#fff;border:1px solid #c8e0cb;border-radius:14px;overflow:hidden}
.vid .frame{aspect-ratio:16/9;background:#000}
.vid iframe,.vid video{width:100%;height:100%;border:0;display:block}
.vid h4{padding:12px 16px;font-size:14px}
.pn{display:flex;justify-content:space-between;gap:14px}
.pn a{flex:1;background:#fff;border:1.5px solid #c8e0cb;border-radius:12px;padding:14px 18px;font-weight:700;text-decoration:none;color:var(--text-color)}
.pn a:hover{border-color:var(--primary)}
.pn small{display:block;color:#5a7a5e;font-weight:400;font-size:12px}
.pn a.next{text-align:left}
.share{display:flex;flex-wrap:wrap;gap:10px}
.share a{background:var(--primary);color:#fff;border-radius:10px;padding:8px 18px;font-size:13px;font-weight:700;text-decoration:none}
.share a:hover{background:var(--primary-dark)}
.map{border:0;width:100%;height:320px;border-radius:14px}
footer{padding:20px 40px;border-top:1px solid #c8e0cb;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;font-size:12px;color:#6a8a6e}
.state-msg{max-width:1000px;margin:80px auto;text-align:center;padding:0 20px}
.state-msg h2{font-size:20px;margin-bottom:10px}
.state-msg a{color:var(--primary);font-weight:700}
.img-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.img-modal-close,.img-modal-nav{position:absolute;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:24px;cursor:pointer;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.img-modal-close:hover,.img-modal-nav:hover{background:rgba(255,255,255,.3)}
.img-modal-close{top:16px;left:16px}
.img-modal-prev{right:16px;top:50%;transform:translateY(-50%)}
.img-modal-next{left:16px;top:50%;transform:translateY(-50%)}
.img-modal-img{max-width:90vw;max-height:82vh;border-radius:12px;object-fit:contain}
.img-modal-caption{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);color:#fff;font-size:14px;font-weight:700;background:rgba(0,0,0,.5);padding:7px 18px;border-radius:20px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}.pn{flex-direction:column}.cover{padding:44px 20px 30px}section.sec{padding:40px 20px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<nav>
  <a class="logo" href="index.html">
    <div class="logo-icon">T</div>
    <div class="logo-text">تعاونی مسکن<br>پالایشگاه گاز ولیعصر (عج)</div>
  </a>
  <a class="back" href="index.html">→ بازگشت به سایت</a>
</nav>
<div id="app"></div>
<footer>
  <span>© ۱۴۰۳ تعاونی مسکن پالایشگاه گاز ولیعصر (عج)</span>
  <span>داده‌ها در مرورگر شما ذخیره می‌شوند 🔒</span>
</footer>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const SUPABASE_URL = "https://gsqwuibzplwalrahevdc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_8duEw2Pj-B8fEupNzDzHag_CHN0riMC";
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function h(tag, attrs, children){
  var el = document.createElement(tag);
  if(attrs) Object.keys(attrs).forEach(function(k){
    if(k==="style"){Object.assign(el.style, attrs[k]);}
    else if(k==="className"){el.className=attrs[k];}
    else if(k.indexOf("on")===0){el[k.toLowerCase()]=attrs[k];}
    else{el.setAttribute(k,attrs[k]);}
  });
  if(children){
    (Array.isArray(children)?children:[children]).forEach(function(c){
      if(c===null||c===undefined)return;
      el.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(c):c);
    });
  }
  return el;
}
var app = document.getElementById("app");

/* دسته‌بندی خودکار عکس‌ها بر اساس ابتدای نام فایل:
   render_1.jpg → رندرهای پروژه   |   progress_1.jpg → مراحل ساخت   |   plan_1.jpg → پلان‌ها   |   بقیه → سایر تصاویر */
var CATS = {
  render:{label:"رندرهای پروژه", prefixes:["render","rndr"]},
  progress:{label:"مراحل ساخت", prefixes:["progress","construction","build"]},
  plan:{label:"پلان‌ها", prefixes:["plan","layout"]},
  other:{label:"سایر تصاویر", prefixes:[]}
};
function categoryOf(filename){
  var base=filename.toLowerCase();
  for(var key in CATS){
    if(key==="other") continue;
    if(CATS[key].prefixes.some(function(p){return base.indexOf(p)===0;})) return key;
  }
  return "other";
}

function stateMsg(title, desc){
  app.innerHTML="";
  var box=h("div",{className:"state-msg"});
  box.appendChild(h("h2",{},[title]));
  if(desc) box.appendChild(h("p",{style:{color:"#5a7a5e",marginBottom:"14px"}},[desc]));
  var a=h("a",{href:"index.html"},["→ بازگشت به سایت"]);
  box.appendChild(a);
  app.appendChild(box);
}

var params = new URLSearchParams(location.search);
var id = params.get("id");
if(!id){
  stateMsg("پروژه‌ای مشخص نشده", "آدرس صفحه ناقص است.");
} else {
  loadProject(id);
}

var lightbox = { images: [], index: 0 };
function openLightbox(images, idx){
  lightbox.images = images; lightbox.index = idx;
  renderLightbox();
}
function renderLightbox(){
  var old = document.getElementById("imgModal");
  if(old) old.remove();
  if(lightbox.images.length===0) return;
  var it = lightbox.images[lightbox.index];
  var bg = h("div",{className:"img-modal-bg", id:"imgModal", onclick:function(e){ if(e.target.id==="imgModal") closeLightbox(); }});
  var closeBtn = h("button",{className:"img-modal-close", onclick:closeLightbox},["×"]);
  bg.appendChild(closeBtn);
  if(lightbox.images.length>1){
    bg.appendChild(h("button",{className:"img-modal-nav img-modal-prev", onclick:function(){ step(1); }},["›"]));
    bg.appendChild(h("button",{className:"img-modal-nav img-modal-next", onclick:function(){ step(-1); }},["‹"]));
  }
  bg.appendChild(h("img",{className:"img-modal-img", src:it.url, alt:it.caption||""}));
  if(lightbox.images.length>1) bg.appendChild(h("div",{className:"img-modal-caption"},[(lightbox.index+1)+" / "+lightbox.images.length]));
  document.body.appendChild(bg);
}
function step(d){ lightbox.index=(lightbox.index+d+lightbox.images.length)%lightbox.images.length; renderLightbox(); }
function closeLightbox(){ var old=document.getElementById("imgModal"); if(old) old.remove(); }
document.addEventListener("keydown", function(e){
  if(!document.getElementById("imgModal")) return;
  if(e.key==="Escape") closeLightbox();
  if(e.key==="ArrowLeft") step(1);
  if(e.key==="ArrowRight") step(-1);
});

async function loadProject(id){
  var { data: project, error } = await sb.from("projects").select("*").eq("id", id).single();
  if(error || !project){
    stateMsg("پروژه یافت نشد", "ممکن است این پروژه حذف شده یا آدرس اشتباه باشد.");
    return;
  }
  document.title = project.name + " | تعاونی مسکن پالایشگاه گاز ولیعصر (عج)";

  var { data: files } = await sb.storage.from("project-photos").list(String(id), { sortBy:{ column:"name", order:"asc" } });
  var byCat = { render:[], progress:[], plan:[], other:[] };
  (files||[]).filter(function(f){ return f.name && f.id!==null; }).forEach(function(f){
    var url = sb.storage.from("project-photos").getPublicUrl(id+"/"+f.name).data.publicUrl;
    byCat[categoryOf(f.name)].push({ url:url, caption:project.name });
  });
  var coverUrl = byCat.render[0] ? byCat.render[0].url : (byCat.other[0] ? byCat.other[0].url : (byCat.progress[0]?byCat.progress[0].url:null));

  var { data: allProjects } = await sb.from("projects").select("id,name,sort_order").order("sort_order",{ascending:true});
  var neighbors = getNeighbors(allProjects||[], project.id);

  renderProject(project, byCat, coverUrl, neighbors);
}

function getNeighbors(list, id){
  var idx = list.findIndex(function(p){ return String(p.id)===String(id); });
  if(idx===-1) return {prev:null,next:null};
  return { prev: idx>0?list[idx-1]:null, next: idx<list.length-1?list[idx+1]:null };
}

function specRows(project){
  return [
    ["نام پروژه", project.name],
    ["موقعیت", project.location],
    ["کارفرما", project.employer],
    ["مشاور و مجری", project.consultant]
  ].filter(function(r){ return r[1]; });
}
function techRows(project){
  return [
    ["متراژ زمین", project.land_area],
    ["تعداد بلوک", project.block_count],
    ["متراژ زیربنا", project.floor_area],
    ["تعداد طبقات و واحدها", project.floors_units],
    ["اسکلت", project.structure],
    ["سقف", project.roof],
    ["امکانات", project.facilities]
  ].filter(function(r){ return r[1]; });
}

var activeTab = null;
function renderProject(project, byCat, coverUrl, neighbors){
  app.innerHTML = "";

  var cover = h("section",{className:"cover", style: coverUrl?{backgroundImage:"url('"+coverUrl+"')"}:{}});
  var ci = h("div",{className:"cover-in"});
  ci.appendChild(h("span",{className:"tag"},["پروژه‌های مسکونی"]));
  ci.appendChild(h("h1",{},[project.name]));
  if(project.tagline) ci.appendChild(h("p",{},[project.tagline]));
  ci.appendChild(h("span",{className:"badge "+(project.done?"badge-g":"badge-y")},[project.done?"تکمیل‌شده":"در حال اجرا"]));
  cover.appendChild(ci);
  app.appendChild(cover);

  if(project.description){
    var descSec = h("section",{className:"sec"});
    var di = h("div",{className:"sec-inner"});
    di.appendChild(h("span",{className:"section-tag"},["درباره پروژه"]));
    di.appendChild(h("h2",{},["معرفی"]));
    di.appendChild(h("p",{style:{color:"#3d6b45",maxWidth:"70ch"}},[project.description]));
    descSec.appendChild(di);
    app.appendChild(descSec);
  }

  var sr = specRows(project), tr = techRows(project);
  if(sr.length || tr.length){
    var specSec = h("section",{className:"sec alt"});
    var si = h("div",{className:"sec-inner"});
    si.appendChild(h("span",{className:"section-tag"},["مشخصات"]));
    si.appendChild(h("h2",{},["مشخصات پروژه"]));
    var g = h("div",{className:"grid2"});
    if(sr.length){
      var c1=h("div",{className:"card"}); c1.appendChild(h("h3",{},["مشخصات کلی"]));
      var dl1=h("dl",{}); sr.forEach(function(r){ dl1.appendChild(h("dt",{},[r[0]])); dl1.appendChild(h("dd",{},[r[1]])); }); c1.appendChild(dl1);
      g.appendChild(c1);
    }
    if(tr.length){
      var c2=h("div",{className:"card"}); c2.appendChild(h("h3",{},["مشخصات فنی"]));
      var dl2=h("dl",{}); tr.forEach(function(r){ dl2.appendChild(h("dt",{},[r[0]])); dl2.appendChild(h("dd",{},[r[1]])); }); c2.appendChild(dl2);
      g.appendChild(c2);
    }
    si.appendChild(g);
    specSec.appendChild(si);
    app.appendChild(specSec);
  }

  var tabDefs = [];
  ["render","progress","plan","other"].forEach(function(key){
    if(byCat[key].length) tabDefs.push({key:key, label:CATS[key].label, images:byCat[key]});
  });
  var videos = Array.isArray(project.videos) ? project.videos : [];
  if(videos.length) tabDefs.push({key:"video", label:"ویدیو", videos:videos});

  if(tabDefs.length){
    var gsec = h("section",{className:"sec"});
    var gi = h("div",{className:"sec-inner"});
    gi.appendChild(h("span",{className:"section-tag"},["گالری"]));
    gi.appendChild(h("h2",{},["تصاویر و ویدیوی پروژه"]));
    if(!activeTab || !tabDefs.some(function(t){return t.key===activeTab;})) activeTab = tabDefs[0].key;
    var tabsEl = h("div",{className:"tabs"});
    tabDefs.forEach(function(t){
      var b=h("button",{className:t.key===activeTab?"on":""},[t.label]);
      b.onclick=function(){ activeTab=t.key; renderProject(project, byCat, coverUrl, neighbors); };
      tabsEl.appendChild(b);
    });
    gi.appendChild(tabsEl);
    var active = tabDefs.find(function(t){return t.key===activeTab;});
    if(active.images){
      var gal=h("div",{className:"gal"});
      active.images.forEach(function(im,k){
        var th=h("button",{className:"thumb"});
        th.appendChild(h("img",{src:im.url, alt:im.caption||project.name, loading:"lazy"}));
        th.onclick=function(){ openLightbox(active.images, k); };
        gal.appendChild(th);
      });
      gi.appendChild(gal);
    } else {
      var vids=h("div",{className:"vids"});
      active.videos.forEach(function(v){
        var vc=h("div",{className:"vid"});
        var frame=h("div",{className:"frame"});
        if(v.type==="file"){ frame.appendChild(h("video",{src:v.src, controls:"controls", preload:"metadata"})); }
        else{ frame.appendChild(h("iframe",{src:v.src, allowfullscreen:"true", loading:"lazy", title:v.title||project.name})); }
        vc.appendChild(frame);
        vc.appendChild(h("h4",{},[v.title||"ویدیوی پروژه"]));
        vids.appendChild(vc);
      });
      gi.appendChild(vids);
    }
    gsec.appendChild(gi);
    app.appendChild(gsec);
  }

  if(neighbors.prev || neighbors.next){
    var pnsec = h("section",{className:"sec alt"});
    var pni = h("div",{className:"sec-inner pn"});
    if(neighbors.prev){
      var pa=h("a",{href:"project-detail.html?id="+neighbors.prev.id});
      pa.appendChild(h("small",{},["پروژه‌ی قبلی"])); pa.appendChild(document.createTextNode(neighbors.prev.name));
      pni.appendChild(pa);
    } else pni.appendChild(h("span",{}));
    if(neighbors.next){
      var na=h("a",{className:"next", href:"project-detail.html?id="+neighbors.next.id});
      na.appendChild(h("small",{},["پروژه‌ی بعدی"])); na.appendChild(document.createTextNode(neighbors.next.name));
      pni.appendChild(na);
    } else pni.appendChild(h("span",{}));
    pnsec.appendChild(pni);
    app.appendChild(pnsec);
  }

  var shsec = h("section",{className:"sec"});
  var shi = h("div",{className:"sec-inner"});
  shi.appendChild(h("span",{className:"section-tag"},["اشتراک‌گذاری"]));
  shi.appendChild(h("h2",{},["این صفحه را به اشتراک بگذارید"]));
  var url = encodeURIComponent(location.href), txt = encodeURIComponent(project.name);
  var sh = h("div",{className:"share"});
  sh.appendChild(h("a",{target:"_blank", rel:"noopener", href:"https://wa.me/?text="+txt+"%20"+url},["واتساپ"]));
  sh.appendChild(h("a",{target:"_blank", rel:"noopener", href:"https://t.me/share/url?url="+url+"&text="+txt},["تلگرام"]));
  sh.appendChild(h("a",{href:"mailto:?subject="+txt+"&body="+url},["ایمیل"]));
  shi.appendChild(sh);
  shsec.appendChild(shi);
  app.appendChild(shsec);

  if(project.map_query || project.address){
    var mapSec = h("section",{className:"sec alt"});
    var mi = h("div",{className:"sec-inner"});
    mi.appendChild(h("span",{className:"section-tag"},["موقعیت"]));
    mi.appendChild(h("h2",{},["موقعیت روی نقشه"]));
    if(project.address) mi.appendChild(h("p",{style:{color:"#3d6b45",marginBottom:"14px"}},[project.address]));
    mi.appendChild(h("iframe",{className:"map", loading:"lazy", title:"نقشه", src:"https://maps.google.com/maps?q="+encodeURIComponent(project.map_query||project.address)+"&t=m&z=15&output=embed"}));
    mapSec.appendChild(mi);
    app.appendChild(mapSec);
  }
}
</script>
</body>
</html>
