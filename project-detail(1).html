<style>
:root{
  --font-family:'Vazirmatn','Tahoma',sans-serif;
  --primary:#1f4287; --primary-dark:#0d1f45; --primary-light:#3a68bf;
  --accent:#e2b85a;
  --page-bg:#ffffff; --alt-bg:#f5f6f9; --text-color:#0c1a36;
  --line:#e3e7ef;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-family);direction:rtl;background:var(--page-bg);color:var(--text-color);min-height:100vh;line-height:1.9;font-size:14px}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
nav{position:sticky;top:0;z-index:100;background:rgba(13,31,69,.96);backdrop-filter:blur(14px);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;text-decoration:none}
.logo-icon{width:36px;height:36px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--primary-dark);font-weight:900;font-size:14px;flex-shrink:0}
.logo-text{font-size:14px;font-weight:800;color:#fff;line-height:1.3}
.back{color:#d5dff2;font-size:13px;text-decoration:none;padding:8px 12px;border-radius:8px;border:1px solid transparent}
.back:hover{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.08)}

/* تور/کاور */
.tour-wrap{max-width:1180px;margin:22px auto 0;padding:0 20px}
.tour{position:relative;border-radius:18px;overflow:hidden;background:var(--primary-dark);aspect-ratio:16/8;box-shadow:0 10px 30px rgba(13,31,69,.25)}
.tour img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tour::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(13,31,69,.65),transparent 45%)}
.hot{position:absolute;transform:translate(50%,-50%);z-index:2;background:rgba(31,66,135,.9);color:#fff;border:2px solid #fff;border-radius:999px;padding:8px 16px;font-size:12.5px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.35);white-space:nowrap}
.hot:hover,.hot:focus-visible{background:var(--accent);color:var(--primary-dark);border-color:var(--accent)}
.nav-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:3;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:12px;padding:10px 14px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;max-width:150px}
.nav-arrow:hover{background:rgba(255,255,255,.3)}
.nav-arrow.prev{right:14px}
.nav-arrow.next{left:14px}
.nav-arrow b{display:block;font-size:11.5px;color:#cfdcf2;font-weight:500}
.cover-title{position:absolute;bottom:16px;right:18px;z-index:2;color:#fff}
.cover-title h1{font-size:clamp(18px,2.6vw,26px);font-weight:900}
.cover-title span{font-size:11px;letter-spacing:3px;color:var(--accent);font-weight:700}
.hint{max-width:1180px;margin:10px auto 0;padding:0 24px;font-size:12px;color:#6b7590}

section.sec{max-width:1180px;margin:0 auto;padding:34px 20px}
section.sec.alt{background:var(--alt-bg)}
.sec h2{font-size:19px;font-weight:900;margin-bottom:16px}
.section-tag{font-size:11px;letter-spacing:4px;color:var(--primary);font-weight:700;margin-bottom:6px;display:block}
.sec > p.lead{max-width:70ch;color:#3a4766;font-size:14.5px}

/* مشخصات */
.spec-dl{display:grid;grid-template-columns:max-content 1fr;gap:0 18px;max-width:720px}
.spec-dl dt,.spec-dl dd{padding:10px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.spec-dl dt{color:#6b7590;white-space:nowrap}
.spec-dl dd{font-weight:700}
.spec-dl>:nth-last-child(-n+2){border-bottom:0}
.specs-wrap{display:grid;grid-template-columns:1fr 1fr;gap:30px}

/* گالری/گرید عکس */
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.photo-card img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;display:block;cursor:zoom-in;box-shadow:0 4px 16px rgba(13,31,69,.1);transition:transform .25s}
.photo-card img:hover{transform:translateY(-3px)}
.photo-card .cap{margin-top:8px;font-size:13px;font-weight:700;text-align:center;color:var(--text-color)}
.empty-note{color:#6b7590;font-size:13px}
.vid-box{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin-bottom:10px}
.vid-box iframe,.vid-box video{width:100%;height:100%;border:0;display:block}
.vid-title{font-size:13px;font-weight:700;margin-bottom:22px}

.share{display:flex;flex-wrap:wrap;gap:10px}
.share a{background:var(--primary);color:#fff;border-radius:10px;padding:8px 18px;font-size:13px;font-weight:700;text-decoration:none}
.share a:hover{background:var(--primary-dark)}
.map{border:0;width:100%;height:320px;border-radius:14px;display:block}
footer{padding:20px 24px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;font-size:12px;color:#6b7590}
.state-msg{max-width:1000px;margin:80px auto;text-align:center;padding:0 20px}
.state-msg h2{font-size:20px;margin-bottom:10px}
.state-msg a{color:var(--primary);font-weight:700}

.img-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.img-modal-close{position:absolute;top:16px;left:16px;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:22px;width:42px;height:42px;border-radius:50%}
.img-modal-close:hover{background:rgba(255,255,255,.3)}
.img-modal-img{max-width:90vw;max-height:78vh;border-radius:10px;object-fit:contain;display:block;margin:0 auto}
.img-modal-cap{color:#e6e9f2;text-align:center;margin-top:12px;font-size:13px}

@media(max-width:860px){.specs-wrap{grid-template-columns:1fr}.nav-arrow{max-width:110px;font-size:11px;padding:8px 10px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div id="app"></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const SUPABASE_URL = "https://gsqwuibzplwalrahevdc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_8duEw2Pj-B8fEupNzDzHag_CHN0riMC";
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function h(tag, attrs, children){
  var el = document.createElement(tag);
  if(attrs) Object.keys(attrs).forEach(function(k){
    if(k==="style"){Object.assign(el.style, attrs[k]);}
    else if(k==="className"){el.className=attrs[k];}
    else if(k.indexOf("on")===0){el[k.toLowerCase()]=attrs[k];}
    else{el.setAttribute(k,attrs[k]);}
  });
  if(children){
    (Array.isArray(children)?children:[children]).forEach(function(c){
      if(c===null||c===undefined)return;
      el.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(c):c);
    });
  }
  return el;
}
var app = document.getElementById("app");

var CATS = {
  render:{label:"تصاویر رندر", tag:"گالری رندر", shortTag:"تصاویر رندر", prefixes:["render","rndr"]},
  progress:{label:"عکس‌های پیشرفت ساخت‌وساز", tag:"پیشرفت پروژه", shortTag:"روند ساخت", prefixes:["progress","construction","build"]},
  plan:{label:"پلان‌ها", tag:"نقشه‌ی واحدها", shortTag:"پلان واحدها", prefixes:["plan","layout"]},
  other:{label:"سایر تصاویر", tag:"تصاویر دیگر", shortTag:"گالری", prefixes:[]}
};

// نام فایل جدید: {دسته}__{عنوان}__{زمان}_{رندوم}.پسوند — عنوان از پنل مدیریت گرفته می‌شه
// فایل‌های قدیمی‌تر که این قالب رو ندارن هم با حدس از روی پیشوند قدیمی پشتیبانی می‌شن
function legacyCategoryOf(base){
  var low = base.toLowerCase();
  for(var key in CATS){ if(key==="other") continue;
    if(CATS[key].prefixes.some(function(p){return low.indexOf(p)===0;})) return key;
  }
  return "other";
}
function parsePhotoName(name){
  var base = name.replace(/\.[0-9a-zA-Z]+$/,"");
  var parts = base.split("__");
  if(parts.length>=3){
    return { category: CATS[parts[0]] ? parts[0] : "other", caption: parts[1].replace(/-/g," ").trim() };
  }
  return { category: legacyCategoryOf(base), caption: "" };
}


/* ---- سئو: متای هر پروژه (گوگل جاوااسکریپت رو اجرا می‌کنه و این‌ها رو می‌خونه) ---- */
var SITE_URL = "https://tmpv.ir";
function setMeta(attr, key, value){
  var el = document.head.querySelector("meta["+attr+"=\""+key+"\"]");
  if(!el){ el = document.createElement("meta"); el.setAttribute(attr, key); document.head.appendChild(el); }
  el.setAttribute("content", value);
}
function setCanonical(url){
  var el = document.head.querySelector("link[rel=canonical]");
  if(!el){ el = document.createElement("link"); el.setAttribute("rel","canonical"); document.head.appendChild(el); }
  el.setAttribute("href", url);
}
function shortText(s, n){
  s = String(s||"").replace(/\s+/g," ").trim();
  return s.length > n ? s.slice(0, n-1).trim() + "…" : s;
}
function applyProjectSeo(project, coverUrl){
  var title = project.name + " | تعاونی مسکن پالایشگاه گاز ولیعصر (عج)";
  var desc = shortText(project.description, 155) || ("جزئیات پروژه‌ی "+project.name+" از تعاونی مسکن پالایشگاه گاز ولیعصر (عج): مشخصات، تصاویر و پیشرفت ساخت.");
  var url = SITE_URL + "/project-detail.html?id=" + encodeURIComponent(project.id);
  setCanonical(url);
  setMeta("name","description",desc);
  setMeta("name","robots","index,follow,max-image-preview:large");
  setMeta("property","og:title",title);
  setMeta("property","og:description",desc);
  setMeta("property","og:url",url);
  setMeta("name","twitter:title",title);
  setMeta("name","twitter:description",desc);
  if(coverUrl){ setMeta("property","og:image",coverUrl); setMeta("name","twitter:image",coverUrl); }
}

function stateMsg(title, desc){
  setMeta("name","robots","noindex,follow");
  app.innerHTML="";
  var box=h("div",{className:"state-msg"});
  box.appendChild(h("h2",{},[title]));
  if(desc) box.appendChild(h("p",{style:{color:"#6b7590",marginBottom:"14px"}},[desc]));
  box.appendChild(h("a",{href:"index.html"},["→ بازگشت به سایت"]));
  app.appendChild(box);
}

var params = new URLSearchParams(location.search);
var id = params.get("id");
if(!id){ stateMsg("پروژه‌ای مشخص نشده","آدرس صفحه ناقص است."); }
else { loadProject(id); }

/* لایت‌باکس بزرگ‌نمایی عکس */
function openLightbox(url, caption){
  var old=document.getElementById("imgModal"); if(old) old.remove();
  var bg=h("div",{className:"img-modal-bg", id:"imgModal", onclick:function(e){ if(e.target.id==="imgModal") bg.remove(); }});
  bg.appendChild(h("button",{className:"img-modal-close", onclick:function(){bg.remove();}},["×"]));
  var wrap = h("div",{});
  wrap.appendChild(h("img",{className:"img-modal-img", src:url, alt:caption||""}));
  if(caption) wrap.appendChild(h("div",{className:"img-modal-cap"},[caption]));
  bg.appendChild(wrap);
  document.body.appendChild(bg);
}

async function loadProject(id){
  var { data: project, error } = await sb.from("projects").select("*").eq("id", id).single();
  if(error || !project){ stateMsg("پروژه یافت نشد","ممکن است این پروژه حذف شده یا آدرس اشتباه باشد."); return; }
  document.title = project.name + " | تعاونی مسکن پالایشگاه گاز ولیعصر (عج)";

  var { data: files } = await sb.storage.from("project-photos").list(String(id), { sortBy:{ column:"name", order:"asc" } });
  var byCat = { render:[], progress:[], plan:[], other:[] };
  (files||[]).filter(function(f){ return f.name && f.id!==null; }).forEach(function(f){
    var url = sb.storage.from("project-photos").getPublicUrl(id+"/"+f.name).data.publicUrl;
    var meta = parsePhotoName(f.name);
    byCat[meta.category].push({ url:url, name:f.name, caption: meta.caption || project.name });
  });
  var allPhotos = byCat.render.concat(byCat.progress, byCat.plan, byCat.other);
  var coverUrl = null;
  if(project.cover_image){
    var found = allPhotos.find(function(p){ return p.name===project.cover_image; });
    coverUrl = found ? found.url : null;
  }
  if(!coverUrl) coverUrl = allPhotos[0] ? allPhotos[0].url : null;

  var { data: allProjects } = await sb.from("projects").select("id,name,sort_order").order("sort_order",{ascending:true});
  var idx = (allProjects||[]).findIndex(function(p){ return String(p.id)===String(project.id); });
  var neighbors = idx===-1 ? {prev:null,next:null} : {
    prev: idx>0 ? allProjects[idx-1] : null,
    next: idx<allProjects.length-1 ? allProjects[idx+1] : null
  };

  applyProjectSeo(project, coverUrl);
  render(project, byCat, coverUrl, neighbors);
}

function specRows(project){
  return [["نام پروژه",project.name],["موقعیت",project.location],["کارفرما",project.employer],["مشاور و مجری",project.consultant]].filter(function(r){return r[1];});
}
function techRows(project){
  return [["متراژ زمین",project.land_area],["تعداد بلوک‌ها",project.block_count],["متراژ زیربنا",project.floor_area],
    ["تعداد طبقات و واحدها",project.floors_units],["اسکلت",project.structure],["سقف",project.roof],["امکانات",project.facilities]
  ].filter(function(r){return r[1];});
}

function specTable(rows){
  var dl=h("dl",{className:"spec-dl"});
  rows.forEach(function(r){ dl.appendChild(h("dt",{},[r[0]])); dl.appendChild(h("dd",{},[r[1]])); });
  return dl;
}

function photoGrid(images){
  var grid = h("div",{className:"photo-grid"});
  images.forEach(function(im){
    var card = h("div",{className:"photo-card"});
    card.appendChild(h("img",{src:im.url, alt:im.caption||"", loading:"lazy",
      onclick:function(){ openLightbox(im.url, im.caption); }}));
    if(im.caption) card.appendChild(h("div",{className:"cap"},[im.caption]));
    grid.appendChild(card);
  });
  return grid;
}

function gallerySection(key, images, alt){
  var sec = h("section",{className:"sec"+(alt?" alt":""), id:"sec-"+key});
  sec.appendChild(h("span",{className:"section-tag"},[CATS[key] ? CATS[key].shortTag : ""]));
  sec.appendChild(h("h2",{},[CATS[key] ? CATS[key].tag : ""]));
  sec.appendChild(photoGrid(images));
  return sec;
}

function render(project, byCat, coverUrl, neighbors){
  app.innerHTML = "";

  /* ---------- تور / کاور ---------- */
  var tourWrap = h("div",{className:"tour-wrap"});
  var tour = h("div",{className:"tour"});
  if(coverUrl) tour.appendChild(h("img",{src:coverUrl, alt:project.name}));
  (project.hotspots||[]).forEach(function(s){
    var btn = h("button",{className:"hot", style:{right:s.x+"%", top:s.y+"%"}},[s.label]);
    btn.onclick=function(){
      var targetKey = CATS[s.category] ? s.category : ["render","progress","plan","other"].find(function(k){return byCat[k].length;});
      var el = targetKey ? document.getElementById("sec-"+targetKey) : null;
      if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
    };
    tour.appendChild(btn);
  });
  if(neighbors.prev){
    var pa=h("a",{className:"nav-arrow prev", href:"project-detail.html?id="+neighbors.prev.id});
    pa.appendChild(document.createTextNode("‹ پروژه‌ی قبل")); pa.appendChild(h("b",{},[neighbors.prev.name]));
    tour.appendChild(pa);
  }
  if(neighbors.next){
    var na=h("a",{className:"nav-arrow next", href:"project-detail.html?id="+neighbors.next.id});
    na.appendChild(document.createTextNode("پروژه‌ی بعد ›")); na.appendChild(h("b",{},[neighbors.next.name]));
    tour.appendChild(na);
  }
  var ct = h("div",{className:"cover-title"});
  ct.appendChild(h("span",{},["پروژه‌های مسکونی"]));
  ct.appendChild(h("h1",{},[project.name]));
  tour.appendChild(ct);
  tourWrap.appendChild(tour);
  app.appendChild(tourWrap);
  if((project.hotspots||[]).length) app.appendChild(h("div",{className:"hint"},["روی نقطه‌های روی عکس بزن تا به بخش مربوطه بری."]));

  var altToggle = false;
  function nextAlt(){ altToggle = !altToggle; return altToggle; }

  /* ---------- مقدمه ---------- */
  if(project.description){
    var introSec = h("section",{className:"sec"});
    introSec.appendChild(h("span",{className:"section-tag"},["معرفی"]));
    introSec.appendChild(h("h2",{},["درباره‌ی "+project.name]));
    introSec.appendChild(h("p",{className:"lead"},[project.description]));
    app.appendChild(introSec);
  }

  /* ---------- مشخصات عمومی و فنی ---------- */
  var sr = specRows(project), tr = techRows(project);
  if(sr.length || tr.length){
    var specSec = h("section",{className:"sec"+(nextAlt()?" alt":"")});
    specSec.appendChild(h("span",{className:"section-tag"},["مشخصات"]));
    specSec.appendChild(h("h2",{},["مشخصات پروژه"]));
    var specsWrap = h("div",{className:"specs-wrap"});
    if(sr.length){
      var c1=h("div",{}); c1.appendChild(h("h2",{style:{fontSize:"14px",marginBottom:"10px",color:"#3a4766"}},["مشخصات عمومی"])); c1.appendChild(specTable(sr));
      specsWrap.appendChild(c1);
    }
    if(tr.length){
      var c2=h("div",{}); c2.appendChild(h("h2",{style:{fontSize:"14px",marginBottom:"10px",color:"#3a4766"}},["مشخصات فنی"])); c2.appendChild(specTable(tr));
      specsWrap.appendChild(c2);
    }
    specSec.appendChild(specsWrap);
    app.appendChild(specSec);
  }

  /* ---------- گالری‌ها، هر دسته یه بخش جدا با گرید عکس‌دار ---------- */
  ["render","progress","plan","other"].forEach(function(key){
    if(byCat[key].length) app.appendChild(gallerySection(key, byCat[key], nextAlt()));
  });

  /* ---------- ویدیو ---------- */
  var videos = Array.isArray(project.videos) ? project.videos : [];
  if(videos.length){
    var vidSec = h("section",{className:"sec"+(nextAlt()?" alt":"")});
    vidSec.appendChild(h("span",{className:"section-tag"},["ویدیو"]));
    vidSec.appendChild(h("h2",{},["ویدیوهای پروژه"]));
    videos.forEach(function(v){
      var box=h("div",{className:"vid-box"});
      if(v.type==="file"){ box.appendChild(h("video",{src:v.src, controls:"controls", preload:"metadata"})); }
      else{ box.appendChild(h("iframe",{src:v.src, allowfullscreen:"true", loading:"lazy", title:v.title||project.name})); }
      vidSec.appendChild(box);
      vidSec.appendChild(h("div",{className:"vid-title"},[v.title||"ویدیوی پروژه"]));
    });
    app.appendChild(vidSec);
  }

  if(!byCat.render.length && !byCat.progress.length && !byCat.plan.length && !byCat.other.length && !videos.length){
    var emptySec = h("section",{className:"sec"});
    emptySec.appendChild(h("div",{className:"empty-note"},["هنوز عکس یا ویدیویی برای این پروژه ثبت نشده."]));
    app.appendChild(emptySec);
  }

  /* ---------- اشتراک‌گذاری ---------- */
  var shsec = h("section",{className:"sec"+(nextAlt()?" alt":"")});
  shsec.appendChild(h("span",{className:"section-tag"},["اشتراک‌گذاری"]));
  shsec.appendChild(h("h2",{},["این صفحه را به اشتراک بگذارید"]));
  var url = encodeURIComponent(location.href), txt = encodeURIComponent(project.name);
  var sh = h("div",{className:"share"});
  sh.appendChild(h("a",{target:"_blank", rel:"noopener", href:"https://wa.me/?text="+txt+"%20"+url},["واتساپ"]));
  sh.appendChild(h("a",{target:"_blank", rel:"noopener", href:"https://t.me/share/url?url="+url+"&text="+txt},["تلگرام"]));
  sh.appendChild(h("a",{target:"_blank", rel:"noopener", href:"https://www.linkedin.com/sharing/share-offsite/?url="+url},["لینکدین"]));
  sh.appendChild(h("a",{href:"mailto:?subject="+txt+"&body="+url},["ایمیل"]));
  shsec.appendChild(sh);
  app.appendChild(shsec);

  /* ---------- نقشه ---------- */
  if(project.map_query || project.address){
    var mapSec = h("section",{className:"sec"+(nextAlt()?" alt":"")});
    mapSec.appendChild(h("span",{className:"section-tag"},["موقعیت"]));
    mapSec.appendChild(h("h2",{},["موقعیت روی نقشه"]));
    if(project.address) mapSec.appendChild(h("p",{className:"lead",style:{marginBottom:"14px"}},[project.address]));
    mapSec.appendChild(h("iframe",{className:"map", loading:"lazy", title:"نقشه", src:"https://maps.google.com/maps?q="+encodeURIComponent(project.map_query||project.address)+"&t=m&z=15&output=embed"}));
    app.appendChild(mapSec);
  }
}
</script>
</body>
</html>
