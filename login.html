<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود | تعاونی مسکن پالایشگاه گاز ولیعصر</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Vazirmatn',Tahoma,sans-serif;direction:rtl;background:#f0f7f1;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(45,122,58,.12);padding:40px 36px;width:100%;max-width:420px;margin:24px}
.logo{text-align:center;margin-bottom:28px}
.logo h1{color:#2d7a3a;font-size:1.3rem;font-weight:700;line-height:1.6}
.logo p{color:#666;font-size:.85rem;margin-top:4px}
.field{margin-bottom:18px}
label{display:block;font-size:.85rem;color:#444;margin-bottom:6px;font-weight:600}
input{width:100%;padding:11px 14px;border:1.5px solid #d0e8d4;border-radius:8px;font-family:inherit;font-size:.95rem;color:#222}
input:focus{outline:none;border-color:#2d7a3a}
.btn{width:100%;padding:13px;background:#2d7a3a;color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;transition:background .2s}
.btn:hover{background:#235f2c}
.btn:disabled{background:#aaa;cursor:not-allowed}
.err{padding:12px 16px;border-radius:8px;font-size:.9rem;margin-bottom:16px;background:#fdecea;color:#c62828;display:none}
.err.show{display:block}
.links{text-align:center;margin-top:20px;font-size:.88rem;color:#666}
.links a{color:#2d7a3a;text-decoration:none;font-weight:600}
.admin-link{text-align:center;margin-top:12px}
.admin-link a{font-size:.82rem;color:#888;text-decoration:none}
.admin-link a:hover{color:#2d7a3a}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>🏠 تعاونی مسکن<br>پالایشگاه گاز ولیعصر (عج)</h1>
    <p>ورود به حساب کاربری</p>
  </div>

  <div class="err" id="errMsg"></div>

  <div class="field">
    <label>ایمیل</label>
    <input type="email" id="email" placeholder="example@email.com">
  </div>
  <div class="field">
    <label>رمز عبور</label>
    <input type="password" id="password" placeholder="رمز عبور">
  </div>
  <button class="btn" id="btnLogin" onclick="doLogin()">ورود به حساب</button>

  <div class="links">
    حساب ندارید؟ <a href="register.html">ثبت‌نام کنید</a>
  </div>
  <div class="admin-link">
    <a href="admin.html">🔐 ورود به پنل مدیریت</a>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAQsgs130rhQ0K1JPPxXzZq-cyDk40a4ho",
  authDomain: "tmpv-cooperative.firebaseapp.com",
  projectId: "tmpv-cooperative",
  storageBucket: "tmpv-cooperative.firebasestorage.app",
  messagingSenderId: "644066134252",
  appId: "1:644066134252:web:2e678c4128ac35b203fdc9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.doLogin = async function(){
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('password').value;
  const err = document.getElementById('errMsg');
  const btn = document.getElementById('btnLogin');
  
  err.classList.remove('show');
  if(!email || !pass){ err.textContent='ایمیل و رمز عبور را وارد کنید'; err.classList.add('show'); return; }

  btn.disabled = true;
  btn.textContent = 'در حال ورود...';

  try{
    const cred = await signInWithEmailAndPassword(auth, email, pass);
    const uid = cred.user.uid;

    // اگر ادمین بود
    if(email === 'tmpv1372@gmail.com'){
      location.href = 'admin.html';
      return;
    }

    // بررسی وضعیت عضو
    const uDoc = await getDoc(doc(db,'users',uid));
    if(uDoc.exists()){
      const data = uDoc.data();
      if(data.status === 'pending'){
        err.textContent = 'حساب شما در انتظار تأیید مدیریت است';
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'ورود به حساب';
        return;
      }
      if(data.status === 'rejected'){
        err.textContent = 'حساب شما تأیید نشده است. با مدیریت تماس بگیرید';
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'ورود به حساب';
        return;
      }
    }
    location.href = 'dashboard.html';
  }catch(e){
    btn.disabled = false;
    btn.textContent = 'ورود به حساب';
    let msg = 'ایمیل یا رمز عبور اشتباه است';
    if(e.code === 'auth/too-many-requests') msg = 'تعداد تلاش‌های زیاد. لطفاً کمی صبر کنید';
    err.textContent = msg;
    err.classList.add('show');
  }
};

document.getElementById('password').addEventListener('keydown', e=>{
  if(e.key==='Enter') window.doLogin();
});
</script>
</body>
</html>
