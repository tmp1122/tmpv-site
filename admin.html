<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">

<title>تعاونی مسکن پالایشگاه گاز ولیعصر (عج)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Vazirmatn','Tahoma',sans-serif;direction:rtl;background:#f0f7f1;color:#0d2010;min-height:100vh}
nav{position:fixed;top:0;left:0;right:0;z-index:300;background:rgba(232,244,234,.97);backdrop-filter:blur(14px);border-bottom:1px solid #c8e0cb;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;text-decoration:none}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#2d7a3a,#1a5c26);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:14px;flex-shrink:0}
.logo-text{font-size:14px;font-weight:800;color:#0d2010;line-height:1.3}
.nav-links{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.nav-link{cursor:pointer;color:#2d7a3a;font-size:13px;padding:7px 10px;border-radius:6px;border:1px solid transparent;transition:all .25s}
.nav-link:hover{border-color:#2d7a3a33;background:#2d7a3a11}
.btn{padding:9px 18px;font-size:13px;font-weight:700;border-radius:8px;cursor:pointer;font-family:inherit;transition:all .3s;border:none}
.btn-g{background:linear-gradient(135deg,#2d7a3a,#4caf64);color:#fff}
.btn-g:hover{transform:translateY(-2px);box-shadow:0 8px 20px #2d7a3a44}
.btn-o{background:transparent;color:#2d7a3a;border:1.5px solid #2d7a3a}
.btn-o:hover{background:#2d7a3a;color:#fff}
/* HERO */

.hero{position:relative;min-height:100vh;display:flex;align-items:center;padding:100px 40px 60px;overflow:hidden}
.hero-bg{position:absolute;inset:0;z-index:0}.hero-content{position:relative;z-index:10;max-width:640px}
.hero-slide{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity 1.5s ease;opacity:0}
.hero-slide.on{opacity:1}






.hero-btns{display:flex;gap:12px;flex-wrap:wrap}
.hero-dots{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:2}
.hero-dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.4);border:2px solid rgba(255,255,255,0.7);cursor:pointer;transition:all .3s}
.hero-dot.on{background:#4caf64;border-color:#4caf64;width:26px;border-radius:5px}
.hero-label{position:absolute;bottom:50px;right:40px;z-index:2;text-align:right}
.hero-label h4{font-size:14px;color:#fff;font-weight:700}
.hero-label p{font-size:12px;color:rgba(255,255,255,0.65);margin-top:2px}


.tag{font-size:11px;letter-spacing:4px;color:#a0d4a8;font-weight:700;margin-bottom:10px;display:block;text-shadow:0 2px 6px rgba(0,0,0,0.8)}
.hero h1{font-size:clamp(32px,5vw,60px);font-weight:900;line-height:1.25;margin-bottom:18px;color:#ffffff;text-shadow:0 3px 12px rgba(0,0,0,0.8)}
.hero h1 span.green{color:#7dd99a;-webkit-text-fill-color:#7dd99a;background:none;text-shadow:0 3px 12px rgba(0,0,0,0.8)}
.hero p{color:#ffffff;line-height:1.9;font-size:15px;margin-bottom:32px;max-width:480px;font-weight:600;text-shadow:0 2px 8px rgba(0,0,0,0.9)}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;position:absolute;bottom:40px;left:40px}
.stat{background:#fff;border:1px solid #c8e0cb;border-radius:12px;padding:16px 20px;text-align:center}
.stat-n{font-size:28px;font-weight:900;color:#2d7a3a;line-height:1}
.stat-l{color:#5a7a5e;font-size:12px;margin-top:4px}
/* CAROUSEL */
.carousel-section{padding:60px 20px;background:#e8f4ea;text-align:center}
.section-tag{font-size:11px;letter-spacing:4px;color:#2d7a3a;font-weight:700;margin-bottom:8px;display:block}
.divider{width:50px;height:3px;background:linear-gradient(90deg,#2d7a3a,transparent);margin:10px auto 16px;border-radius:2px}
.carousel-section h2{font-size:26px;font-weight:900;color:#0d2010;margin-bottom:6px}
.carousel-section p.sub{font-size:13px;color:#3d6b45;margin-bottom:28px}
.scene{perspective:1200px;width:520px;max-width:92vw;height:320px;margin:0 auto}
.stage{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.25,.46,.45,.94)}
.c-card{position:absolute;width:480px;max-width:88vw;height:300px;left:calc(50% - 240px);border-radius:16px;overflow:hidden;backface-visibility:hidden;box-shadow:0 20px 50px rgba(0,0,0,.3);border:2px solid #2d7a3a44}
.c-card img{width:100%;height:100%;object-fit:cover}
.c-ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,20,5,.7),transparent 55%)}
.c-lbl{position:absolute;bottom:14px;right:16px;text-align:right}
.c-lbl h4{font-size:16px;font-weight:800;color:#fff}
.c-lbl p{font-size:11px;color:#a0d4a8;margin-top:2px}
.thumbs{display:flex;gap:8px;margin-top:16px;justify-content:center;flex-wrap:wrap}
.thumb{width:62px;height:40px;border-radius:7px;overflow:hidden;cursor:pointer;border:2px solid transparent;opacity:.5;transition:all .3s}
.thumb.on{border-color:#2d7a3a;opacity:1;transform:scale(1.1)}
.thumb img{width:100%;height:100%;object-fit:cover}
.c-nav{display:flex;gap:10px;margin-top:14px;justify-content:center;align-items:center}
.c-btn{background:rgba(45,122,58,.15);border:2px solid #2d7a3a;color:#2d7a3a;width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer;transition:all .3s;font-family:inherit}
.c-btn:hover{background:#2d7a3a;color:#fff}
.c-badge{background:rgba(45,122,58,.1);border:1px solid #2d7a3a44;padding:5px 14px;border-radius:20px;font-size:12px;color:#2d7a3a}
/* SECTIONS */
section.sec{padding:70px 40px}
section.sec.alt{background:#e8f4ea}
.sec-inner{max-width:1000px;margin:0 auto}
.sec h2{font-size:30px;font-weight:900;margin-bottom:28px;color:#0d2010}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.card{background:#fff;border:1px solid #c8e0cb;border-radius:14px;padding:22px;transition:all .3s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px #2d7a3a22;border-color:#2d7a3a44}
.card-icon{font-size:30px;margin-bottom:12px}
.card h3{font-size:16px;font-weight:700;margin-bottom:6px;color:#0d2010}
.card p{color:#3d6b45;font-size:13px;line-height:1.7}
.proj-row{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:#fff;border:1px solid #c8e0cb;border-radius:12px;margin-bottom:10px}
.proj-info{display:flex;align-items:center;gap:14px}
.proj-icon{width:40px;height:40px;background:#2d7a3a12;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.proj-name{font-weight:700;font-size:15px;color:#0d2010}
.proj-type{color:#5a7a5e;font-size:12px;margin-top:2px}
.badge{display:inline-block;padding:3px 12px;border-radius:20px;font-size:11px;font-weight:700}
.badge-g{background:#d4f0da;color:#0d3b18;border:1px solid #1a5c26}
.badge-y{background:#fff3cd;color:#7a4f00;border:1px solid #d4a017}
/* CTA */
.cta{padding:60px 40px;text-align:center;background:linear-gradient(135deg,#d4ecda,#e8f4ea)}
.cta h2{font-size:28px;font-weight:900;margin-bottom:12px;color:#0d2010}
.cta p{color:#3d6b45;margin-bottom:24px;font-size:14px}
footer{padding:20px 40px;border-top:1px solid #c8e0cb;display:flex;justify-content:space-between;font-size:12px;color:#6a8a6e}
/* AUTH MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(13,32,16,.75);backdrop-filter:blur(8px);z-index:400;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:74px 16px 60px}
.modal{background:#fff;border:1px solid #c8e0cb;border-radius:20px;padding:28px 24px;width:100%;max-width:420px;position:relative}
.modal-close{position:absolute;top:12px;left:12px;background:none;border:none;font-size:24px;cursor:pointer;color:#5a7a5e}
.modal-logo{width:44px;height:44px;background:linear-gradient(135deg,#2d7a3a,#1a5c26);border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:18px;margin:0 auto 10px}
.modal-title{text-align:center;margin-bottom:20px}
.modal-title h2{font-size:18px;font-weight:800;color:#0d2010}
.modal-title p{color:#5a7a5e;font-size:12px;margin-top:4px}
.tabs{display:flex;background:#f0f7f1;border-radius:10px;padding:4px;margin-bottom:18px}
.tab-btn{flex:1;padding:9px;border:none;border-radius:7px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;transition:all .3s;background:transparent;color:#5a7a5e}
.tab-btn.on{background:linear-gradient(135deg,#2d7a3a,#4caf64);color:#fff}
.inp{width:100%;padding:12px 14px;background:#f5faf6;border:1.5px solid #b8d4bc;border-radius:8px;color:#0d2010;font-size:16px;font-family:inherit;outline:none;transition:border-color .3s;margin-bottom:12px}
.inp:focus{border-color:#2d7a3a}
.pw-wrap{position:relative;margin-bottom:12px}
.pw-wrap .inp{margin-bottom:0;padding-left:44px}
.pw-eye{position:absolute;left:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;color:#5a7a5e}
.lbl{font-size:12px;color:#5a7a5e;margin-bottom:5px;display:block;font-weight:600}
.err{background:#fef2f2;border:1px solid #fca5a5;color:#dc2626;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px}
.suc{background:#f0fdf4;border:1px solid #86efac;color:#16a34a;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px}
select.inp{appearance:none}

.b46-section{padding:70px 40px;background:#f5faf6}
.b46-inner{max-width:1000px;margin:0 auto}
.b46-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}
.b46-card{background:#fff;border:1px solid #c8e0cb;border-radius:14px;overflow:hidden;cursor:pointer;transition:all .3s;position:relative}
.b46-card:hover{transform:translateY(-4px);box-shadow:0 14px 36px #2d7a3a22;border-color:#2d7a3a66}
.b46-card img{width:100%;height:220px;object-fit:cover;display:block;transition:transform .4s}
.b46-card:hover img{transform:scale(1.04)}
.b46-card-body{padding:16px}
.b46-card-body h4{font-size:15px;font-weight:800;color:#0d2010;margin-bottom:4px}
.b46-card-body p{font-size:13px;color:#3d6b45}
.b46-badge{position:absolute;top:12px;right:12px;background:rgba(45,122,58,0.85);color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;backdrop-filter:blur(4px)}

.img-modal-close:hover{background:rgba(255,255,255,0.3)}
.img-modal-img{max-width:90vw;max-height:85vh;border-radius:12px;object-fit:contain}
.img-modal-caption{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);color:#fff;font-size:15px;font-weight:700;background:rgba(0,0,0,0.5);padding:8px 20px;border-radius:20px;white-space:nowrap}

auth.onAuthStateChanged(function(user){

        update();
      }
    });
  } else {

    update();
  }
});

// Render engine
function h(tag, attrs, children){
  var el = document.createElement(tag);
  if(attrs) Object.keys(attrs).forEach(function(k){
    if(k==="style"){Object.assign(el.style, attrs[k]);}
    else if(k==="className"){el.className=attrs[k];}
    else if(k.startsWith("on")){el[k.toLowerCase()]=attrs[k];}
    else{el.setAttribute(k,attrs[k]);}
  });
  if(children){
    (Array.isArray(children)?children:[children]).forEach(function(c){
      if(c===null||c===undefined)return;
      el.appendChild(typeof c==="string"?document.createTextNode(c):c);
    });
  }
  return el;
}

  stage.style.transform="rotateY("+state.carRy+"deg)";

  IMGS.forEach(function(src,i){

    card.appendChild(lbl);
    stage.appendChild(card);
  });
  scene.appendChild(stage);
  sec.appendChild(scene);

  var thumbs=h("div",{className:"thumbs"});
  IMGS.forEach(function(src,i){
    var t=h("div",{className:"thumb"+(state.carIdx===i?" on":"")});
    t.appendChild(h("img",{src:src,alt:""}));
    (function(idx){t.onclick=function(){goTo(idx);};})(i);

  sec.appendChild(thumbs);

  var nav=h("div",{className:"c-nav"});
  var prev=h("button",{className:"c-btn"},["‹"]);
  prev.onclick=function(){spin(1);};
  var pause=h("button",{className:"c-btn"},[carPaused?"▶":"⏸"]);
  pause.onclick=function(){togglePause();};
  var next=h("button",{className:"c-btn"},["›"]);
  next.onclick=function(){spin(-1);};
  var badge=h("div",{className:"c-badge"},[ ["۱","۲","۳","۴","۵"][state.carIdx]+" / ۵"]);
  nav.appendChild(prev);nav.appendChild(pause);nav.appendChild(next);nav.appendChild(badge);
  sec.appendChild(nav);
  return sec;
}

  pw.appendChild(pi);pw.appendChild(eye);
  modal.appendChild(pw);

  if(state.authMode==="register"){
    modal.appendChild(h("label",{className:"lbl"},["شماره تلفن"]));
    var phi=h("input",{className:"inp",type:"tel",placeholder:"۰۹۱۲۰۰۰۰۰۰۰",value:state.form.phone});
    phi.oninput=function(){state.form.phone=this.value;};
    modal.appendChild(phi);
    modal.appendChild(h("label",{className:"lbl"},["سمت / تخصص"]));
    var sel=h("select",{className:"inp"});
    ROLES.forEach(function(r){var o=h("option",{value:r},[r]);if(state.form.role===r)o.selected=true;sel.appendChild(o);});
    sel.onchange=function(){state.form.role=this.value;};
    modal.appendChild(sel);
  }

  var sb=h("button",{className:"btn btn-g",style:{width:"100%",marginTop:"6px"}},
    [state.authMode==="login"?"ورود به حساب":"ایجاد حساب کاربری"]);
  sb.onclick=function(){state.authMode==="login"?doLogin():doRegister();};
  modal.appendChild(sb);

  if(state.authMode==="login"){
    var hint=h("div",{style:{textAlign:"center",fontSize:"12px",color:"#6a8a6e",marginTop:"12px"}},["تست: ahmad@example.com / 1234"]);
    modal.appendChild(hint);
  }
  bg.appendChild(modal);
  return bg;
}

function authErrorMessage(err){
  var code = err && err.code;
  if(code==="auth/user-not-found"||code==="auth/wrong-password"||code==="auth/invalid-credential"){
    return "ایمیل یا رمز عبور اشتباه است";
  }
  if(code==="auth/email-already-in-use"){
    return "این ایمیل قبلاً ثبت شده است";
  }
  if(code==="auth/weak-password"){
    return "رمز عبور باید حداقل ۶ کاراکتر باشد";
  }
  if(code==="auth/invalid-email"){
    return "ایمیل وارد شده معتبر نیست";
  }
  return "خطایی رخ داد. لطفاً دوباره تلاش کنید";
}

function doLogin(){
  state.error="";
  var f=state.form;
  if(!f.email||!f.password){state.error="لطفاً ایمیل و رمز عبور را وارد کنید";update();return;}
  auth.signInWithEmailAndPassword(f.email.trim(), f.password).then(function(cred){
    return db.collection("users").doc(cred.user.uid).get();
  }).then(function(doc){
    state.currentUser = doc.exists ? doc.data() : null;
    state.showAuth=false;state.page="dashboard";
    state.form={name:"",email:"",password:"",phone:"",role:""};
    update();
  }).catch(function(err){
    state.error=authErrorMessage(err);
    update();
  });
}

function doRegister(){
  state.error="";
  var f=state.form;
  if(!f.name||!f.email||!f.password||!f.phone||!f.role){state.error="لطفاً تمام فیلدها را پر کنید";update();return;}
  auth.createUserWithEmailAndPassword(f.email.trim(), f.password).then(function(cred){
    var nu={id:cred.user.uid,name:f.name,email:f.email,role:f.role,phone:f.phone,joinDate:new Date().toLocaleDateString("fa-IR"),dept:"جدید",photo:null,bio:""};
    return db.collection("users").doc(cred.user.uid).set(nu).then(function(){ return nu; });
  }).then(function(nu){
    state.currentUser = nu;
    state.showAuth=false;state.page="dashboard";
    state.form={name:"",email:"",password:"",phone:"",role:""};
    update();
  }).catch(function(err){
    state.error=authErrorMessage(err);
    update();
  });
}

function doLogout(){
  auth.signOut().then(function(){
    state.currentUser=null;state.page="home";update();
  });
}

function buildDash(){
  var u=state.currentUser;
  var wrap=h("div",{style:{minHeight:"100vh",padding:"80px 24px 40px",background:"#f0f7f1"}});
  var inner=h("div",{style:{maxWidth:"860px",margin:"0 auto"}});

  // Profile header
  var ph=h("div",{style:{display:"flex",alignItems:"center",gap:"16px",marginBottom:"24px",padding:"22px",background:"#fff",border:"1px solid #c8e0cb",borderRadius:"16px"}});
  var av=h("div",{style:{width:"64px",height:"64px",borderRadius:"50%",background:"linear-gradient(135deg,#2d7a3a,#1a5c26)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"24px",fontWeight:"900",color:"#fff",flexShrink:"0"}});
  av.textContent=u.name[0]||"؟";
  ph.appendChild(av);
  var pi=h("div",{style:{flex:"1"}});
  pi.appendChild(h("h2",{style:{fontSize:"20px",fontWeight:"800",color:"#0d2010"}},[u.name]));
  pi.appendChild(h("p",{style:{color:"#2d7a3a",fontSize:"13px",marginTop:"3px"}},[u.role+" • "+u.dept]));
  pi.appendChild(h("p",{style:{color:"#6a8a6e",fontSize:"12px",marginTop:"2px"}},["عضو از "+u.joinDate]));
  ph.appendChild(pi);
  var logoutBtn=h("button",{className:"btn",style:{background:"transparent",color:"#ef4444",border:"1.5px solid #ef4444",padding:"8px 14px",fontSize:"12px"}},["خروج"]);
  logoutBtn.onclick=function(){doLogout();};
  ph.appendChild(logoutBtn);
  inner.appendChild(ph);

  // Tabs
  var tabs=h("div",{style:{display:"flex",gap:"20px",borderBottom:"1px solid #c8e0cb",marginBottom:"20px"}});
  [["info","اطلاعات"],["projects","پروژه‌ها"],["actions","خدمات"]].forEach(function(t){
    var btn=h("button",{style:{padding:"10px 0",fontSize:"14px",fontWeight:"600",cursor:"pointer",border:"none",background:"transparent",fontFamily:"inherit",borderBottom:state.dashTab===t[0]?"2px solid #2d7a3a":"2px solid transparent",color:state.dashTab===t[0]?"#2d7a3a":"#6a8a6e",transition:"all .25s"}},[t[1]]);
    (function(tab){btn.onclick=function(){state.dashTab=tab;update();};})(t[0]);
    tabs.appendChild(btn);
  });
  inner.appendChild(tabs);

  if(state.dashTab==="info"){
    var grid=h("div",{className:"grid2"});
    [["✉️","ایمیل",u.email],["📞","شماره تماس",u.phone],["🏢","واحد",u.dept],["👷","سمت",u.role],["📅","تاریخ عضویت",u.joinDate],["🆔","کد عضویت","ARS-"+String(u.id).slice(-4).padStart(4,"0")]].forEach(function(item){
      var c=h("div",{className:"card",style:{padding:"18px"}});
      var top=h("div",{style:{display:"flex",alignItems:"center",gap:"8px",marginBottom:"6px"}});
      top.appendChild(h("span",{style:{fontSize:"16px"}},[item[0]]));
      top.appendChild(h("span",{style:{color:"#6a8a6e",fontSize:"12px"}},[item[1]]));
      c.appendChild(top);
      c.appendChild(h("div",{style:{fontWeight:"600",fontSize:"14px",wordBreak:"break-all",color:"#0d2010"}},[item[2]||"—"]));
      grid.appendChild(c);
    });
    inner.appendChild(grid);
  }

  if(state.dashTab==="projects"){
    var msg=h("div",{style:{padding:"36px",textAlign:"center",color:"#6a8a6e",border:"1px dashed #c8e0cb",borderRadius:"12px"}});
    msg.appendChild(h("div",{style:{fontSize:"36px",marginBottom:"10px"}},["📋"]));
    msg.appendChild(h("div",{},[" هنوز به پروژه‌ای اختصاص نیافته‌اید"]));
    inner.appendChild(msg);
  }

  if(state.dashTab==="actions"){
    var ag=h("div",{className:"grid2"});
    [{icon:"📋",title:"درخواست مرخصی",desc:"ثبت و پیگیری درخواست مرخصی"},{icon:"💰",title:"فیش حقوقی",desc:"مشاهده سوابق حقوق ماهانه"},{icon:"🎓",title:"آموزش و توسعه",desc:"دوره‌های آموزشی شرکت"},{icon:"📞",title:"پشتیبانی IT",desc:"گزارش مشکلات فنی"},{icon:"🏥",title:"بیمه و رفاه",desc:"مشاهده پوشش بیمه‌ای"},{icon:"📣",title:"اطلاعیه‌ها",desc:"اخبار و رویدادهای شرکت"}].forEach(function(a){
      var c=h("div",{className:"card",style:{cursor:"pointer"}});
      c.appendChild(h("div",{style:{fontSize:"28px",marginBottom:"10px"}},[a.icon]));
      c.appendChild(h("div",{style:{fontWeight:"700",fontSize:"14px",marginBottom:"5px",color:"#0d2010"}},[a.title]));
      c.appendChild(h("div",{style:{color:"#5a7a5e",fontSize:"13px"}},[a.desc]));
      ag.appendChild(c);
    });
    inner.appendChild(ag);
  }

  wrap.appendChild(inner);
  return wrap;
}


// Hero slideshow
var heroIdx = 0;
var heroData = [
  {title:"نمای شب", sub:"برج لیدوما — شهرک نفت ۲"},
  {title:"نمای غربی", sub:"۱۱۰ واحد مسکونی"}
];
function goHeroSlide(idx){
  var prev = heroIdx;
  heroIdx = idx;
  var ps = document.getElementById("hslide"+prev);
  var ns = document.getElementById("hslide"+idx);
  if(ps) ps.className = "hero-slide";
  if(ns) ns.className = "hero-slide on";
  for(var i=0;i<2;i++){
    var d = document.getElementById("hdot"+i);
    if(d) d.className = "hero-dot"+(i===idx?" on":"");
  }
  var lt = document.getElementById("hero-ltitle");
  var ls = document.getElementById("hero-lsub");
  if(lt) lt.textContent = heroData[idx].title;
  if(ls) ls.textContent = heroData[idx].sub;
}
setInterval(function(){goHeroSlide((heroIdx+1)%2);}, 5000);

// Start
update();
</script>
