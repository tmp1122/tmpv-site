<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تعاونی مسکن پالایشگاه گاز ولیعصر (عج)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Vazirmatn','Tahoma',sans-serif;direction:rtl;background:#f0f7f1;color:#0d2010;min-height:100vh}
nav{position:fixed;top:0;left:0;right:0;z-index:300;background:rgba(232,244,234,.97);backdrop-filter:blur(14px);border-bottom:1px solid #c8e0cb;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;text-decoration:none}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#2d7a3a,#1a5c26);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:14px;flex-shrink:0}
.logo-text{font-size:14px;font-weight:800;color:#0d2010;line-height:1.3}
.nav-links{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.nav-link{cursor:pointer;color:#2d7a3a;font-size:13px;padding:7px 10px;border-radius:6px;border:1px solid transparent;transition:all .25s}
.nav-link:hover{border-color:#2d7a3a33;background:#2d7a3a11}
.btn{padding:9px 18px;font-size:13px;font-weight:700;border-radius:8px;cursor:pointer;font-family:inherit;transition:all .3s;border:none}
.btn-g{background:linear-gradient(135deg,#2d7a3a,#4caf64);color:#fff}
.btn-g:hover{transform:translateY(-2px);box-shadow:0 8px 20px #2d7a3a44}
.btn-o{background:transparent;color:#2d7a3a;border:1.5px solid #2d7a3a}
